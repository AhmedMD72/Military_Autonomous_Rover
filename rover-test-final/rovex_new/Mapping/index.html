<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapping</title>
    <link rel="icon" type="image/svg+xml" href="../Public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Onest:wght@400;600;700&family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="full-screen-bg">
      <header class="top-bar header-font">
        <div
          class="top-bar-left"
          onclick="window.location.href = '../SelectOperationalMode/index.html'"
        >
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Mode Selection</span>
        </div>

        <div class="brand">
          <i class="fa-solid fa-robot icon-teal"></i>
          <span>Mapping</span>
        </div>

        <div class="status">
          <span class="dot"></span>
          <span>Connected</span>
        </div>
      </header>

      <div class="camera-wrapper">
        <!-- Mapping (right large) -->
        <div class="feed large">
          <div class="feed-label">
            <div class="feed-label-bar"></div>
            <div class="feed-label-text">Mapping</div>
          </div>
          <iframe
               id="feed-mapping"
               style="width: 100%; height: 100%; border: none; display: none"
               allowfullscreen
          ></iframe>
        </div>

        <!-- Face Recognition (top-left) -->
        <div class="feed">
          <div class="feed-label">
            <div class="feed-label-bar"></div>
            <div class="feed-label-text">Face Recognition</div>
          </div>
          <img
            id="feed-face"
            style="width: 100%; height: 100%; object-fit: cover; display: none"
          />
        </div>

        <!-- Objects Detection (bottom-left) -->
        <div class="feed">
          <div class="feed-label">
            <div class="feed-label-bar"></div>
            <div class="feed-label-text">Objects Detection</div>
          </div>
          <img
            id="feed-objects"
            style="width: 100%; height: 100%; object-fit: cover; display: none"
          />
        </div>
      </div>

      <div class="bottom-controls">
        <!-- AI MODELS -->
        <div class="side-panel ai-panel">
          <h3 class="panel-title title-font border-bottom-teal">AI MODELS</h3>
          <div class="ai-buttons">
            <button class="btn-ai btn-font">
              <i class="fa-regular fa-user icon-yellow"></i> Face Recognition
            </button>
            <button class="btn-ai btn-font">
              <i class="fa-solid fa-expand icon-yellow"></i> Object Detection
            </button>
          </div>
        </div>

        <!-- CONTROL PANEL -->
        <div class="side-panel control-panel">
          <h3 class="panel-title title-font border-bottom-dim">
            Control Panel
          </h3>
          <div class="button-group">
            <button class="btn-solid-blue btn-font" id="btn-start-rec">
              <i class="fa-solid fa-backward-step"></i> Start Mapping
            </button>
            <button class="btn-solid-red btn-font" id="btn-stop-rec">
              <i class="fa-solid fa-circle"></i> Stop Mapping
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <script src="../config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
