<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Recognition</title>
    <link rel="icon" type="image/svg+xml" href="../Public/favicon.svg" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Onest:wght@400;600;700&family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="full-screen-bg">
      <header class="top-bar header-font">
        <div
          class="top-bar-left"
          onclick="window.location.href = '../SelectOperationalMode/index.html'"
        >
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Mode Selection</span>
        </div>
        <div class="brand">
          <i class="fa-solid fa-robot icon-teal"></i>
          <span>Face Recognition</span>
        </div>
        <div class="status">
          <span class="dot"></span>
          <span>Connected</span>
        </div>
      </header>

      <main class="main-layout">
        <!-- ═══════════════ LEFT COLUMN ═══════════════ -->
        <div class="left-column">
          <!-- Camera -->
          <div class="camera-container">
            <div class="cam-corners">
              <div class="cam-corner tl"></div>
              <div class="cam-corner tr"></div>
              <div class="cam-corner bl"></div>
              <div class="cam-corner br"></div>
            </div>

            <img
              id="live-camera-feed"
              src=""
              alt="Camera Feed"
              class="camera-stream-url"
            />
            <p
              class="camera-placeholder-text title-font"
              id="camera-placeholder-text"
            >
              Camera Feed
            </p>

            <!-- Target killed overlay (shown via JS) -->
            <div class="target-card" id="targetCard">
              <div class="tc-header">
                <div class="tc-title">DETECTION DONE</div>
                <div class="tc-check">
                  <i class="fa-solid fa-circle-check"></i>
                </div>
              </div>
              <div class="tc-status">Target Eliminated</div>
              <div class="tc-killed">KILLED</div>
              <div class="tc-code">LASER_ENGAGEMENT_SUCCESS</div>
            </div>
          </div>

          <!-- Sensor strip -->
          <div class="sensor-panel">
            <div class="sensor-item border-red item-small">
              <div class="sensor-header btn-font">
                <i class="fa-solid fa-temperature-half text-red"></i>
                Temperature
              </div>
              <div class="sensor-value btn-font" id="val-temp">21°C</div>
            </div>

            <div class="sensor-item border-yellow item-small">
              <div class="sensor-header btn-font">
                <i class="fa-solid fa-droplet text-yellow"></i> Humidity
              </div>
              <div class="sensor-value btn-font" id="val-hum">78%</div>
            </div>

            <div class="sensor-item border-blue item-small">
              <div class="sensor-header btn-font">
                <i class="fa-solid fa-wind text-blue"></i> Air Quality
              </div>
              <div class="sensor-value btn-font" id="val-air">60%</div>
            </div>

            <div class="sensor-item border-orange item-small">
              <div class="sensor-header btn-font">
                <i class="fa-solid fa-cloud text-orange"></i> CO2 %
              </div>
              <div class="sensor-value btn-font" id="val-co2">60%</div>
            </div>
          </div>
        </div>
        <!-- ═══════════════ END LEFT COLUMN ═══════════════ -->

        <!-- ═══════════════ RIGHT COLUMN ═══════════════ -->
        <div class="right-column">
          <!-- Face Recognition upload panel -->
          <div class="side-panel face-rec-panel">
            <h3 class="panel-title text-teal title-font border-bottom-teal">
              <i class="fa-regular fa-user"></i> Face Recognition
            </h3>

            <div
              id="face-preview-container"
              class="face-info"
              style="display: none"
            >
              <img
                id="uploaded-face-img"
                src=""
                alt="Uploaded Face"
                class="avatar-preview"
              />
              <div class="person-details">
                <div
                  class="person-name text-teal title-font"
                  id="uploaded-filename"
                >
                  --
                </div>
                <div class="confidence-text btn-font">
                  Confidence: <span id="val-confidence">--</span>
                </div>
              </div>
            </div>

            <input
              type="file"
              id="photo-upload"
              accept="image/*"
              style="display: none"
            />
            <button
              class="btn-outline-teal btn-font"
              onclick="document.getElementById('photo-upload').click()"
            >
              <i class="fa-solid fa-upload"></i> Upload Photo
            </button>
          </div>

          <!-- Control panel -->
          <div class="side-panel controls-panel">
            <h3 class="panel-title title-font border-bottom-dim">
              Control Panel
            </h3>
            <div class="button-group">
              <button class="btn-solid-blue btn-font" id="btn-start-rec">
                <i class="fa-solid fa-play"></i> Start Recognition
              </button>
              <button class="btn-solid-red btn-font" id="btn-stop-rec">
                <i class="fa-solid fa-stop"></i> Stop Recognition
              </button>
            </div>
          </div>

          <!-- Eliminated targets panel -->
          <div class="side-panel eliminated-panel">
            <h3 class="panel-title title-font border-bottom-dim">
              Eliminated Targets
            </h3>
            <div class="eliminated-list" id="eliminated-list">
              <!-- populated by main.js -->
            </div>
          </div>
        </div>
        <!-- ═══════════════ END RIGHT COLUMN ═══════════════ -->
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
