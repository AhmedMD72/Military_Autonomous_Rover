<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROVEX 1.0 - Splash</title>
    <link rel="icon" type="image/svg+xml" href="Public/favicon.svg" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/your-code.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="splash-container">
      <header class="title-section">
        <h1 class="main-logo">ROVEX <span class="version">1.0</span></h1>
        <p class="tagline">
          INTELLIGENT AUTONOMOUS EXPLORATION & TACTICAL ROVER SYSTEM
        </p>
      </header>

      <div class="rover-display">
        <img
          src="Public/Images/logo.png"
          alt="Rovex Logo"
          class="hero-image"
          id="roverLogo"
        />
      </div>

      <div class="action-section">
        <button class="start-btn" id="missionBtn" onclick="startMission()">
          <img src="Public/Images/Icon.png" alt="icon" class="btn-icon" />
          START MISSIONS
        </button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
