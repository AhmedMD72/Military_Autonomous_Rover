<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
</head>
<body>

<h2>ROS IMU Data</h2>
<div id="imuData">
  <p>Orientation: <span id="orientation"></span></p>
  <p>Angular Velocity: <span id="angularVel"></span></p>
  <p>Linear Acceleration: <span id="linearAcc"></span></p>
</div>

<script>
  // اتصل بـ rosbridge
  var ros = new ROSLIB.Ros({
    url : 'ws://localhost:9090'
  });

  ros.on('connection', function() {
    console.log('Connected to websocket server.');
  });

  ros.on('error', function(error) {
    console.log('Error connecting to websocket server: ', error);
  });

  ros.on('close', function() {
    console.log('Connection to websocket server closed.');
  });

  // Topic للـ IMU
  var imuTopic = new ROSLIB.Topic({
    ros : ros,
    name : '/imu',
    messageType : 'sensor_msgs/msg/Imu'
  });

  imuTopic.subscribe(function(msg) {
    document.getElementById('orientation').innerText = 
      `x: ${msg.orientation.x.toFixed(2)}, y: ${msg.orientation.y.toFixed(2)}, z: ${msg.orientation.z.toFixed(2)}, w: ${msg.orientation.w.toFixed(2)}`;
    
    document.getElementById('angularVel').innerText = 
      `x: ${msg.angular_velocity.x.toFixed(2)}, y: ${msg.angular_velocity.y.toFixed(2)}, z: ${msg.angular_velocity.z.toFixed(2)}`;
    
    document.getElementById('linearAcc').innerText = 
      `x: ${msg.linear_acceleration.x.toFixed(2)}, y: ${msg.linear_acceleration.y.toFixed(2)}, z: ${msg.linear_acceleration.z.toFixed(2)}`;
  });
</script>

</body>
</html>
